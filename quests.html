<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MapleStory Classic 任務索引</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="appHeader">
    <div class="titleArea">
      <h1>任務索引</h1>
      <nav class="topNav" aria-label="頁面切換">
        <a href="./index.html">怪物</a>
        <a href="./items.html">道具索引</a>
        <a class="active" href="./quests.html">任務索引</a>
      </nav>
      <div class="buildMeta" id="buildMeta"></div>
    </div>
    <div class="searchWrap">
      <input id="questSearch" type="search" autocomplete="off" placeholder="輸入任務、NPC、道具、怪物、地圖或 ID" />
      <select id="questCategoryFilter" aria-label="以任務分類篩選">
        <option value="">全部分類</option>
      </select>
      <select id="questLevelFilter" aria-label="以任務等級篩選">
        <option value="">全部等級</option>
        <option value="none">無等級限制</option>
        <option value="1-10">Lv.1-10</option>
        <option value="11-30">Lv.11-30</option>
        <option value="31-70">Lv.31-70</option>
        <option value="71+">Lv.71+</option>
      </select>
      <button id="idToggle" class="toggleIdButton" type="button" aria-pressed="false">顯示ID</button>
      <span id="resultCount"></span>
    </div>
  </header>

  <main class="layout questLayout">
    <aside class="monsterList questIndexList" id="questList"></aside>
    <section class="detail questDetailPane" id="questDetail"></section>
  </main>

  <script src="./quests-data.js"></script>
  <script src="./quests.js"></script>
</body>
</html>
