<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MapleStory Classic 任務索引</title>
  <link rel="icon" href="data:," />
  <script>
    (function () {
      function readCookie(name) {
        try {
          var prefix = encodeURIComponent(name) + "=";
          var rows = document.cookie ? document.cookie.split("; ") : [];
          for (var i = 0; i < rows.length; i += 1) {
            if (rows[i].indexOf(prefix) === 0) return decodeURIComponent(rows[i].slice(prefix.length));
          }
        } catch (_error) {}
        return "";
      }
      try {
        var cookieTheme = readCookie("ms_theme");
        var storedTheme = cookieTheme || (localStorage.getItem("ms-theme") === "dark" ? "dark" : "light");
        document.documentElement.dataset.theme = storedTheme === "dark" ? "dark" : "light";
      } catch (_error) {
        document.documentElement.dataset.theme = readCookie("ms_theme") === "dark" ? "dark" : "light";
      }
    })();
  </script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="appHeader">
    <div class="titleArea">
      <h1>任務索引</h1>
      <nav class="topNav" aria-label="頁面切換">
        <a href="./index.html">怪物</a>
        <a href="./items.html">道具</a>
        <a class="active" href="./quests.html">任務</a>
        <a href="./maps.html">地圖</a>
        <a href="./worldmaps.html">世界地圖</a>
        <a href="./skills.html">技能</a>
        <a href="./patch-notes.html">更新</a>
      </nav>
      <div class="buildMeta" id="buildMeta"></div>
    </div>
    <div class="searchWrap">
      <input id="questSearch" type="search" autocomplete="off" list="searchHistoryOptions" placeholder="輸入任務、NPC、道具、怪物、地圖或 ID" />
      <datalist id="searchHistoryOptions"></datalist>
      <label id="nameOnlySearchControl" class="nameOnlySearchControl">
        <input id="nameOnlySearch" type="checkbox" autocomplete="off" />
        <span>只搜尋名稱</span>
      </label>
      <button id="themeToggle" class="themeIconButton toggleThemeButton" type="button" aria-pressed="false" aria-label="切換為黑底" title="切換為黑底">☾</button>
      <button id="settingsToggle" class="settingsToggle" type="button" aria-expanded="false" aria-controls="settingsPanel" aria-label="顯示設定" title="顯示設定">⚙</button>
      <span id="resultCount"></span>
      <div id="settingsPanel" class="settingsPanel" hidden>
        <button id="clearFilters" class="toggleButton clearFiltersButton" type="button">清除條件</button>
        <select id="questCategoryFilter" aria-label="以任務分類篩選">
          <option value="">全部分類</option>
        </select>
        <label class="advancedField questLevelField">
          <span>最低等級</span>
          <input id="questLevelMin" type="number" min="1" max="999" step="1" inputmode="numeric" placeholder="下限" autocomplete="off" />
        </label>
        <label class="advancedField questLevelField">
          <span>最高等級</span>
          <input id="questLevelMax" type="number" min="1" max="999" step="1" inputmode="numeric" placeholder="上限" autocomplete="off" />
        </label>
        <button id="idToggle" class="toggleIdButton" type="button" aria-pressed="false">顯示ID</button>
      </div>
    </div>
  </header>

  <main class="layout questLayout">
    <aside class="monsterList questIndexList" id="questList"></aside>
    <section class="detail questDetailPane" id="questDetail"></section>
  </main>

  <script src="./quests-data.js"></script>
  <script src="./quests.js"></script>
</body>
</html>
