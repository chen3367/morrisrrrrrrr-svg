<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MapleStory Classic 戰鬥分析</title>
  <link rel="icon" href="data:," />
  <script>
    (function () {
      function readCookie(name) {
        try {
          var prefix = encodeURIComponent(name) + "=";
          var rows = document.cookie ? document.cookie.split("; ") : [];
          for (var i = 0; i < rows.length; i += 1) {
            if (rows[i].indexOf(prefix) === 0) return decodeURIComponent(rows[i].slice(prefix.length));
          }
        } catch (_error) {}
        return "";
      }
      try {
        var cookieTheme = readCookie("ms_theme");
        var storedTheme = cookieTheme || (localStorage.getItem("ms-theme") === "dark" ? "dark" : "light");
        document.documentElement.dataset.theme = storedTheme === "dark" ? "dark" : "light";
      } catch (_error) {
        document.documentElement.dataset.theme = readCookie("ms_theme") === "dark" ? "dark" : "light";
      }
    })();
  </script>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .combatAnalysisPage {
      min-height: calc(100vh - var(--header-height, 124px));
      padding: 12px;
      background: var(--page);
    }
    .combatAnalysisShell {
      display: grid;
      grid-template-columns: minmax(300px, 420px) minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      max-width: 1680px;
      margin: 0 auto;
    }
    .combatPanel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .combatPanelHeader,
    .combatPanelBody {
      padding: 14px;
    }
    .combatPanelHeader {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .combatPanelHeader h2,
    .combatSection h3 {
      margin: 0;
      color: var(--plain-text);
      line-height: 1.2;
    }
    .combatPanelHeader h2 {
      font-size: 22px;
    }
    .combatSection h3 {
      font-size: 18px;
    }
    .combatMuted,
    .combatHint,
    .combatStatus {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.45;
    }
    .combatHint {
      margin-top: 8px;
    }
    .combatStatus {
      min-height: 18px;
      color: var(--link);
    }
    .combatControls {
      position: sticky;
      top: calc(var(--header-height, 124px) + 10px);
      max-height: calc(100vh - var(--header-height, 124px) - 22px);
      overflow: auto;
    }
    .combatSection {
      display: grid;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      padding: 14px;
    }
    .combatSection:last-child {
      border-bottom: 0;
    }
    .combatActionGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .combatButton,
    .combatButtonSecondary,
    .combatButtonDanger {
      min-height: 42px;
      border: 1px solid var(--button-border);
      border-radius: 8px;
      padding: 8px 10px;
      background: var(--button-bg);
      color: var(--plain-text);
      font-size: 14px;
      font-weight: 950;
      cursor: pointer;
    }
    .combatButton {
      border-color: var(--green-border);
      background: var(--green-bg);
      color: var(--green-text);
    }
    .combatButtonDanger {
      border-color: var(--danger-border, #b45353);
      background: var(--danger-bg, rgba(180, 83, 83, 0.12));
      color: var(--danger-text, #b45353);
    }
    .combatButton:disabled,
    .combatButtonSecondary:disabled,
    .combatButtonDanger:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .combatPreview {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--control-soft);
      aspect-ratio: 16 / 9;
    }
    .combatPreview video,
    .combatPreview canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #05070b;
    }
    .combatCropGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .combatCropCard {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
    }
    .combatCropCard canvas {
      width: 100%;
      height: 56px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #05070b;
      object-fit: contain;
    }
    .combatFormGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .combatField {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }
    .combatField input {
      min-width: 0;
      width: 100%;
      border: 1px solid var(--input-border);
      border-radius: 8px;
      padding: 10px 11px;
      background: var(--input-bg);
      color: var(--plain-text);
      font-size: 15px;
      font-weight: 850;
    }
    .combatHero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding: 18px;
    }
    .combatHero h2 {
      margin: 0;
      color: var(--plain-text);
      font-size: 30px;
      line-height: 1.2;
    }
    .combatHero p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.45;
    }
    .combatSummaryGrid {
      display: grid;
      grid-template-columns: repeat(4, minmax(110px, 1fr));
      gap: 10px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }
    .combatMetricCard {
      min-height: 80px;
      border: 1px solid var(--gold-border);
      border-radius: 8px;
      padding: 10px;
      background: var(--gold-bg);
      display: grid;
      align-content: center;
      gap: 3px;
      text-align: center;
    }
    .combatMetricCard strong {
      color: var(--plain-text);
      font-size: 23px;
      line-height: 1.15;
      white-space: nowrap;
    }
    .combatMetricCard span {
      color: var(--meso-text);
      font-size: 12px;
      font-weight: 950;
    }
    .combatDetailBody {
      display: grid;
      gap: 14px;
      padding: 14px;
    }
    .combatCard {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .combatCardHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      padding: 12px 14px;
    }
    .combatCardHeader h3 {
      margin: 0;
      color: var(--plain-text);
      font-size: 18px;
      line-height: 1.2;
    }
    .combatCardBody {
      padding: 14px;
    }
    .combatSnapshotGrid {
      display: grid;
      grid-template-columns: repeat(4, minmax(110px, 1fr));
      gap: 10px;
    }
    .combatSnapshot {
      border: 1px dashed var(--soft-line);
      border-radius: 8px;
      padding: 10px;
      background: var(--control-soft);
    }
    .combatSnapshot b {
      display: block;
      color: var(--plain-text);
      font-size: 20px;
      line-height: 1.2;
      white-space: nowrap;
    }
    .combatSnapshot span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }
    .combatTableWrap {
      overflow: auto;
      max-height: 360px;
      border-top: 1px solid var(--line);
    }
    .combatTable,
    .levelExpTable {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
      font-size: 14px;
    }
    .combatTable th,
    .combatTable td,
    .levelExpTable th,
    .levelExpTable td {
      border-bottom: 1px solid var(--line);
      padding: 9px 12px;
      text-align: right;
      white-space: nowrap;
    }
    .combatTable th:first-child,
    .combatTable td:first-child,
    .levelExpTable th:first-child,
    .levelExpTable td:first-child {
      text-align: left;
    }
    .combatTable th,
    .levelExpTable th {
      position: sticky;
      top: 0;
      z-index: 1;
      color: var(--muted);
      background: var(--control-soft);
      font-size: 12px;
      font-weight: 950;
    }
    .combatTable td,
    .levelExpTable td {
      color: var(--plain-text);
      font-weight: 800;
    }
    .combatEmpty {
      color: var(--muted);
      font-weight: 850;
      line-height: 1.6;
    }
    .levelExpDetails {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .levelExpDetails summary {
      cursor: pointer;
      list-style: none;
      padding: 14px;
      color: var(--plain-text);
      font-size: 18px;
      font-weight: 950;
      border-bottom: 1px solid var(--line);
    }
    .levelExpDetails summary::-webkit-details-marker {
      display: none;
    }
    @media (max-width: 980px) {
      .combatAnalysisPage {
        padding: 8px;
      }
      .combatAnalysisShell {
        grid-template-columns: 1fr;
      }
      .combatControls {
        position: static;
        max-height: none;
      }
      .combatHero {
        grid-template-columns: 1fr;
        padding: 14px;
      }
      .combatHero h2 {
        font-size: 24px;
      }
      .combatSummaryGrid,
      .combatSnapshotGrid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .combatActionGrid,
      .combatFormGrid,
      .combatCropGrid {
        grid-template-columns: 1fr;
      }
      .combatMetricCard strong,
      .combatSnapshot b {
        font-size: 19px;
      }
    }
  </style>
</head>
<body>
  <header class="appHeader">
    <div class="titleArea">
      <h1>戰鬥分析</h1>
      <nav class="topNav groupedTopNav" aria-label="頁面切換">
        <details class="navMenuGroup" open>
          <summary>楓葉圖鑑</summary>
          <div class="navMenuLinks">
          <a href="./index.html">怪物</a>
          <a href="./items.html">道具</a>
          <a href="./quests.html">任務</a>
          <a href="./maps.html">地圖</a>
          <a href="./skills.html">技能</a>
          </div>
        </details>
        <details class="navMenuGroup active" open>
          <summary>實用工具</summary>
          <div class="navMenuLinks">
          <a href="./scroll-simulator.html">卷軸模擬器</a>
          <a href="./damage-calculator.html">戰鬥力計算機</a>
          <a class="active" href="./combat-analysis.html">戰鬥分析</a>
          </div>
        </details>
        <details class="navMenuGroup" open>
          <summary>其他</summary>
          <div class="navMenuLinks">
          <a href="./patch-notes.html">遊戲更新日誌</a>
          <a href="./web-changelog.html">網頁更新日誌</a>
          </div>
        </details>
      </nav>
      <div class="buildMeta" id="buildMeta"></div>
    </div>
    <div class="searchWrap">
      <button id="themeToggle" class="themeIconButton toggleThemeButton" type="button" aria-pressed="false" aria-label="切換為黑底" title="切換為黑底">☾</button>
      <span id="resultCount"></span>
    </div>
  </header>

  <main class="combatAnalysisPage">
    <div class="combatAnalysisShell">
      <aside class="combatPanel combatControls" aria-label="戰鬥分析控制">
        <section class="combatSection">
          <h3>螢幕讀取</h3>
          <div class="combatPreview">
            <video id="captureVideo" muted playsinline></video>
          </div>
          <div class="combatActionGrid">
            <button class="combatButton" type="button" id="shareScreenButton">分享螢幕</button>
            <button class="combatButton" type="button" id="startAnalysisButton">開始分析</button>
            <button class="combatButtonSecondary" type="button" id="captureOnceButton">擷取一次</button>
            <button class="combatButtonDanger" type="button" id="stopAnalysisButton">停止</button>
          </div>
          <button class="combatButtonSecondary" type="button" id="resetSnapshotsButton">重設紀錄</button>
          <div class="combatStatus" id="ocrStatus"></div>
          <p class="combatHint">分享遊戲視窗後，頁面會在本機擷取 EXP 與楓幣區塊；背包開啟時才能讀到右上角楓幣。</p>
        </section>

        <section class="combatSection">
          <h3>辨識區塊</h3>
          <div class="combatCropGrid">
            <label class="combatCropCard">
              EXP
              <canvas id="expCropCanvas"></canvas>
            </label>
            <label class="combatCropCard">
              楓幣
              <canvas id="mesoCropCanvas"></canvas>
            </label>
          </div>
        </section>

        <section class="combatSection">
          <h3>校正數值</h3>
          <div class="combatFormGrid">
            <label class="combatField">等級<input id="manualLevel" type="number" min="1" max="200" inputmode="numeric" /></label>
            <label class="combatField">EXP<input id="manualExp" type="text" inputmode="numeric" /></label>
            <label class="combatField">EXP %<input id="manualPercent" type="text" inputmode="decimal" /></label>
            <label class="combatField">楓幣<input id="manualMeso" type="text" inputmode="numeric" /></label>
          </div>
          <button class="combatButton" type="button" id="addManualSnapshotButton">校正並加入</button>
        </section>
      </aside>

      <section class="combatPanel" id="combatAnalysisPanel" aria-labelledby="combatAnalysisTitle"></section>
    </div>
  </main>

  <script src="./combat-analysis-data.js"></script>
  <script src="./combat-analysis.js"></script>
</body>
</html>
