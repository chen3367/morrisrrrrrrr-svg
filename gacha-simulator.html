  <span id="resultCount" hidden></span>



  <main class="layout simulatorLayout gachaLayout">
    <aside class="monsterList simulatorControls gachaControls">
      <section class="simControlSection">
        <h2>轉蛋商品</h2>
        <select id="poolSelect" class="simNativeSelect" aria-label="選擇轉蛋商品"></select>
        <div id="poolCards" class="gachaProductGrid" role="listbox" aria-label="選擇轉蛋商品"></div>
      </section>

      <section id="royalPanel" class="simControlSection gachaRoyalPanel" hidden>
        <h2>皇家美容美髮</h2>
        <label class="advancedField fullWidthField">
          <span>使用券種</span>
          <select id="royalCouponSelect" aria-label="選擇皇家券種">
            <option value="hair">皇家美髮券</option>
            <option value="face">皇家美容券</option>
          </select>
        </label>
        <label class="advancedField fullWidthField">
          <span>角色性別</span>
          <select id="royalGenderSelect" aria-label="選擇角色性別">
            <option value="male">男角色</option>
            <option value="female">女角色</option>
          </select>
        </label>
      </section>

      <section class="simControlSection">
        <h2>目標獎項</h2>
        <label class="advancedField fullWidthField">
          <span>搜尋獎項</span>
          <input id="targetSearch" type="search" autocomplete="off" placeholder="輸入獎項名稱或等級" />
        </label>
        <select id="targetGroupFilter" aria-label="依獎池篩選">
          <option value="">全部獎池</option>
        </select>
        <select id="targetSelect" class="simNativeSelect" aria-label="選擇目標獎項"></select>
        <div id="targetList" class="simPickerList gachaPrizePicker" role="listbox" aria-label="選擇目標獎項"></div>
      </section>

      <section id="exchangePanel" class="simControlSection gachaExchangePanel" hidden>
        <h2>彗星碎片</h2>
        <label class="advancedField fullWidthField">
          <span>兌換一次璀璨彗星所需碎片</span>
          <input id="exchangeFragmentsRequired" type="number" min="0" max="9999" step="1" inputmode="numeric" placeholder="80" autocomplete="off" />
        </label>
        <label class="gachaCheckField">
          <input id="autoOpenExchange" type="checkbox" checked />
          <span>自動打開璀璨彗星</span>
        </label>
        <div id="exchangeTierSettings" class="gachaTierSettings"></div>
      </section>

      <section class="simControlSection">
        <h2>抽取模擬</h2>
        <label class="advancedField fullWidthField">
          <span>單抽成本（楓葉點數）</span>
          <input id="unitPrice" type="text" inputmode="numeric" placeholder="楓葉點數" autocomplete="off" />
          <small id="unitPriceHint" class="priceHint"></small>
        </label>
        <label class="advancedField fullWidthField">
          <span>抽獎間隔（ms）</span>
          <input id="drawDelayMs" type="number" min="0" max="5000" step="10" inputmode="numeric" placeholder="0" autocomplete="off" />
        </label>
        <label class="advancedField fullWidthField">
          <span>抽到目標上限</span>
          <input id="autoLimit" type="number" min="1" max="100000" step="100" inputmode="numeric" autocomplete="off" />
        </label>
        <div class="gachaDrawButtons">
          <button id="drawOne" class="toggleButton" type="button">單抽</button>
          <button id="drawTen" class="toggleButton" type="button">10 抽</button>
          <button id="drawUntilTarget" class="toggleButton primaryActionButton" type="button">抽到目標</button>
          <button id="resetSimulation" class="toggleButton clearFiltersButton" type="button">重置模擬</button>
          <button id="stopDraw" class="toggleButton clearFiltersButton" type="button" disabled>停止抽取</button>
        </div>
      </section>
      <section class="simControlSection utilitySettingsSection">
        <h2>工具設定</h2>
        <div id="settingsPanel" class="settingsPanel utilitySettingsPanel">
                <button id="clearFilters" class="toggleButton clearFiltersButton" type="button">清除條件</button>
                <button id="idToggle" class="toggleIdButton" type="button" aria-pressed="false">顯示ID</button>
              </div>
      </section>
    </aside>

    <section class="detail simulatorDetail gachaDetail" id="gachaDetail"></section>
