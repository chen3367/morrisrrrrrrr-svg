  <script>
    (function () {
      function readCookie(name) {
        try {
          var prefix = encodeURIComponent(name) + "=";
          var rows = document.cookie ? document.cookie.split("; ") : [];
          for (var i = 0; i < rows.length; i += 1) {
            if (rows[i].indexOf(prefix) === 0) return decodeURIComponent(rows[i].slice(prefix.length));
          }
        } catch (_error) {}
        return "";
      }
      try {
        var cookieTheme = readCookie("ms_theme");
        var storedTheme = cookieTheme || (localStorage.getItem("ms-theme") === "dark" ? "dark" : "light");
        document.documentElement.dataset.theme = storedTheme === "dark" ? "dark" : "light";
      } catch (_error) {
        document.documentElement.dataset.theme = readCookie("ms_theme") === "dark" ? "dark" : "light";
      }
    })();
  </script>

  <span id="resultCount" hidden></span>



  <main class="layout simulatorLayout">
    <aside class="monsterList simulatorControls">
      <section class="simControlSection">
        <h2>裝備</h2>
        <label class="advancedField fullWidthField">
          <span>篩選裝備</span>
          <input id="equipmentSearch" type="search" autocomplete="off" list="searchHistoryOptions" placeholder="輸入裝備名稱或 ID" />
        </label>
        <div class="simFilterGrid">
          <select id="equipmentGroupFilter" aria-label="以裝備大類篩選">
            <option value="">全部大類</option>
            <option value="armor">防具</option>
            <option value="weapon">武器</option>
            <option value="accessory">飾品</option>
            <option value="other">其他</option>
          </select>
          <select id="equipmentPartFilter" aria-label="以裝備部位篩選">
            <option value="">全部部位</option>
          </select>
          <select id="equipmentJobFilter" class="fullGridControl" aria-label="以裝備可用職業篩選">
            <option value="">全部職業</option>
            <option value="warrior">劍士</option>
            <option value="magician">法師</option>
            <option value="bowman">弓箭手</option>
            <option value="thief">盜賊</option>
            <option value="pirate">海盜</option>
          </select>
          <div class="simLevelRangeField">
            <span>等級範圍</span>
            <div class="simLevelRangeInputs">
              <input id="itemLevelMin" type="number" min="1" max="999" step="1" inputmode="numeric" placeholder="最低" aria-label="最低等級" autocomplete="off" />
              <span aria-hidden="true">~</span>
              <input id="itemLevelMax" type="number" min="1" max="999" step="1" inputmode="numeric" placeholder="最高" aria-label="最高等級" autocomplete="off" />
            </div>
          </div>
          <label class="simCheckControl">
            <input id="equipmentSourcedOnly" type="checkbox" autocomplete="off" />
            <span>只顯示有來源裝備</span>
          </label>
        </div>
        <datalist id="searchHistoryOptions"></datalist>
        <select id="equipmentSelect" class="simNativeSelect" aria-label="選擇裝備"></select>
        <div id="equipmentPicker" class="simPickerList" role="listbox" aria-label="選擇裝備"></div>
        <div id="initialStatsPanel" class="initialStatsPanel"></div>
        <label class="advancedField fullWidthField">
          <span>目前裝備市場價格</span>
          <input id="equipmentPrice" type="text" inputmode="numeric" placeholder="0" autocomplete="off" />
          <small id="equipmentPriceHint" class="priceHint"></small>
        </label>
      </section>

      <section class="simControlSection">
        <h2>卷軸策略</h2>
        <label class="advancedField fullWidthField">
          <span>篩選卷軸</span>
          <input id="scrollSearch" type="search" autocomplete="off" list="searchHistoryOptions" placeholder="輸入卷軸名稱、效果或 ID" />
        </label>
        <div class="simFilterGrid twoColumn">
          <select id="scrollSuccessFilter" aria-label="以卷軸成功率篩選">
            <option value="">全部成功率</option>
          </select>
          <label class="simCheckControl">
            <input id="scrollSourcedOnly" type="checkbox" autocomplete="off" />
            <span>只顯示有來源卷軸</span>
          </label>
        </div>
        <select id="scrollSelect" class="simNativeSelect" aria-label="選擇卷軸"></select>
        <div id="scrollPicker" class="simPickerList compactPickerList" role="listbox" aria-label="選擇卷軸"></div>
        <div class="simInlineControls">
          <label class="advancedField">
            <span>張數</span>
            <input id="scrollCount" type="number" min="1" max="100" step="1" inputmode="numeric" value="1" autocomplete="off" />
          </label>
          <label class="advancedField">
            <span>目標成功</span>
            <input id="scrollTarget" type="number" min="0" max="1" step="1" inputmode="numeric" value="1" autocomplete="off" />
          </label>
          <label class="advancedField priceField">
            <span>卷軸價格</span>
            <input id="scrollPrice" type="text" inputmode="numeric" placeholder="0" autocomplete="off" />
            <small id="scrollPriceHint" class="priceHint"></small>
          </label>
        </div>
        <button id="addScroll" class="toggleButton primaryActionButton" type="button">加入卷軸</button>
        <div id="strategyList" class="strategyList"></div>
      </section>

      <section class="simControlSection">
        <h2>計算</h2>
        <button id="runSimulation" class="toggleButton primaryActionButton" type="button">開始計算</button>
      </section>
      <section class="simControlSection utilitySettingsSection">
        <h2>工具設定</h2>
        <div id="settingsPanel" class="settingsPanel utilitySettingsPanel">
                <button id="clearFilters" class="toggleButton clearFiltersButton" type="button">清除條件</button>
                <label class="advancedField">
                  <span>模擬次數</span>
                  <input id="trialCount" type="number" min="100" max="20000" step="100" inputmode="numeric" autocomplete="off" />
                </label>
                <button id="idToggle" class="toggleIdButton" type="button" aria-pressed="false">顯示ID</button>
              </div>
      </section>
    </aside>

    <section class="detail simulatorDetail" id="simulatorDetail"></section>
  </main>

  <script src="./scroll-simulator-data.js?v=20260820142124"></script>
