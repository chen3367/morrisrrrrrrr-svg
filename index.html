<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MapleStory Classic 怪物掉落搜尋</title>
  <link rel="icon" href="data:," />
  <script>
    (function () {
      function readCookie(name) {
        try {
          var prefix = encodeURIComponent(name) + "=";
          var rows = document.cookie ? document.cookie.split("; ") : [];
          for (var i = 0; i < rows.length; i += 1) {
            if (rows[i].indexOf(prefix) === 0) return decodeURIComponent(rows[i].slice(prefix.length));
          }
        } catch (_error) {}
        return "";
      }
      try {
        var cookieTheme = readCookie("ms_theme");
        var storedTheme = cookieTheme || (localStorage.getItem("ms-theme") === "dark" ? "dark" : "light");
        document.documentElement.dataset.theme = storedTheme === "dark" ? "dark" : "light";
      } catch (_error) {
        document.documentElement.dataset.theme = readCookie("ms_theme") === "dark" ? "dark" : "light";
      }
    })();
  </script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="appHeader">
    <div class="titleArea">
      <h1>怪物掉落搜尋</h1>
      <nav class="topNav" aria-label="頁面切換">
        <a class="active" href="./index.html">怪物</a>
        <a href="./items.html">道具</a>
        <a href="./quests.html">任務</a>
        <a href="./maps.html">地圖</a>
        <a href="./worldmaps.html">世界地圖</a>
        <a href="./skills.html">技能</a>
      </nav>
      <div class="buildMeta" id="buildMeta"></div>
    </div>
    <div class="searchWrap">
      <input id="search" type="search" autocomplete="off" list="searchHistoryOptions" placeholder="輸入怪物、道具、地圖名稱或 ID" />
      <datalist id="searchHistoryOptions"></datalist>
      <label id="nameOnlySearchControl" class="nameOnlySearchControl">
        <input id="nameOnlySearch" type="checkbox" autocomplete="off" />
        <span>只搜尋名稱</span>
      </label>
      <button id="settingsToggle" class="settingsToggle" type="button" aria-expanded="false" aria-controls="settingsPanel" aria-label="顯示設定" title="顯示設定">⚙</button>
      <span id="resultCount"></span>
      <div id="settingsPanel" class="settingsPanel" hidden>
        <div id="continentFilter" class="multiSelect">
          <button id="continentMenuButton" class="multiSelectButton" type="button" aria-expanded="false" aria-controls="continentOptions">全部一般大陸</button>
          <div id="continentOptions" class="multiSelectOptions" role="group" aria-label="以大陸複選篩選" hidden>
            <button id="continentClear" class="multiSelectClear" type="button">清除選取</button>
          </div>
        </div>
        <button id="unknownToggle" class="toggleButton" type="button" aria-pressed="false">顯示未知大陸</button>
        <button id="unnamedMapToggle" class="toggleButton" type="button" aria-pressed="false">顯示未命名地圖怪物</button>
        <button id="unnamedToggle" class="toggleButton" type="button" aria-pressed="false">顯示未命名道具</button>
        <button id="idToggle" class="toggleIdButton" type="button" aria-pressed="false">顯示ID</button>
        <button id="themeToggle" class="toggleThemeButton" type="button" aria-pressed="false">黑底模式</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="monsterList" id="monsterList"></aside>
    <section class="detail" id="detail"></section>
  </main>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
