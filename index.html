<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MapleStory Classic 怪物掉落搜尋</title>
  <script>
    (function () {
      try {
        document.documentElement.dataset.theme = localStorage.getItem("ms-theme") === "dark" ? "dark" : "light";
      } catch (_error) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="appHeader">
    <div class="titleArea">
      <h1>怪物掉落搜尋</h1>
      <nav class="topNav" aria-label="頁面切換">
        <a class="active" href="./index.html">怪物</a>
        <a href="./items.html">道具索引</a>
        <a href="./quests.html">任務索引</a>
      </nav>
      <div class="buildMeta" id="buildMeta"></div>
    </div>
    <div class="searchWrap">
      <input id="search" type="search" autocomplete="off" placeholder="輸入怪物、道具、地圖名稱或 ID" />
      <select id="continentFilter" aria-label="以大陸篩選">
        <option value="">全部大陸</option>
      </select>
      <button id="unknownToggle" class="toggleButton" type="button" aria-pressed="false">顯示未知大陸</button>
      <button id="unnamedMapToggle" class="toggleButton" type="button" aria-pressed="false">顯示未命名地圖怪物</button>
      <button id="unnamedToggle" class="toggleButton" type="button" aria-pressed="false">顯示未命名道具</button>
      <button id="idToggle" class="toggleIdButton" type="button" aria-pressed="false">顯示ID</button>
      <button id="themeToggle" class="toggleThemeButton" type="button" aria-pressed="false">黑底模式</button>
      <span id="resultCount"></span>
    </div>
  </header>

  <main class="layout">
    <aside class="monsterList" id="monsterList"></aside>
    <section class="detail" id="detail"></section>
  </main>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
