<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MapleStory Classic 戰鬥力計算機</title>
  <link rel="icon" href="data:," />
  <script>
    (function () {
      function readCookie(name) {
        try {
          var prefix = encodeURIComponent(name) + "=";
          var rows = document.cookie ? document.cookie.split("; ") : [];
          for (var i = 0; i < rows.length; i += 1) {
            if (rows[i].indexOf(prefix) === 0) return decodeURIComponent(rows[i].slice(prefix.length));
          }
        } catch (_error) {}
        return "";
      }
      try {
        var cookieTheme = readCookie("ms_theme");
        var storedTheme = cookieTheme || (localStorage.getItem("ms-theme") === "dark" ? "dark" : "light");
        document.documentElement.dataset.theme = storedTheme === "dark" ? "dark" : "light";
      } catch (_error) {
        document.documentElement.dataset.theme = readCookie("ms_theme") === "dark" ? "dark" : "light";
      }
    })();
  </script>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .damageLayout {
      grid-template-columns: minmax(360px, 460px) minmax(0, 1fr);
    }
    .damageControls {
      gap: 12px;
      padding: 14px;
    }
    .damageControlSection {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px;
      background: var(--panel);
    }
    .damageControlSection h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }
    .damageGrid,
    .damageStatGrid,
    .damageAttackGrid {
      display: grid;
      gap: 10px;
    }
    .damageGrid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .characterGrid .jobField {
      grid-column: 1 / -1;
    }
    .damageStatGrid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .damageAttackGrid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .damageField {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    .damageField input,
    .damageField select,
    .damageSearchInput {
      box-sizing: border-box;
      width: 100%;
      min-width: 0;
      border: 1px solid var(--control-border);
      border-radius: 7px;
      padding: 9px 10px;
      background: var(--control-bg);
      color: var(--plain-text);
      font: inherit;
      font-weight: 800;
    }
    .damageField input {
      text-align: right;
    }
    .damageField.full {
      grid-column: 1 / -1;
    }
    .skillLevelList,
    .buffList,
    .damageItemBuffResults {
      display: grid;
      gap: 8px;
      max-height: 310px;
      overflow: auto;
      padding-right: 4px;
    }
    .skillLevelRow,
    .buffRow,
    .damageItemBuffRow {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) minmax(96px, 112px);
      gap: 9px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      background: var(--card);
      min-width: 0;
      overflow: hidden;
    }
    .buffRow {
      grid-template-columns: 22px 38px minmax(0, 1fr);
    }
    .partyBuffRow {
      grid-template-columns: 22px 38px minmax(0, 1fr);
      grid-template-areas:
        "toggle icon label"
        ". . level";
      cursor: pointer;
    }
    .buffRow.isActive {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .buffRow > input[type="checkbox"] {
      box-sizing: border-box;
      flex: 0 0 16px;
      width: 16px;
      min-width: 16px;
      max-width: 16px;
      height: 16px;
      min-height: 16px;
      max-height: 16px;
      margin: 0;
      padding: 0;
      justify-self: center;
      align-self: start;
    }
    .partyBuffRow > input[type="checkbox"] {
      grid-area: toggle;
    }
    .partyBuffRow > img {
      grid-area: icon;
    }
    .partyBuffRow > .partyBuffInfo {
      grid-area: label;
      min-width: 0;
      cursor: pointer;
    }
    .partyBuffLevelControl {
      grid-area: level;
      display: grid;
      grid-template-columns: auto minmax(76px, 104px);
      gap: 8px;
      align-items: center;
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }
    .partyBuffLevel {
      box-sizing: border-box;
      width: 100%;
      min-width: 0;
      border: 1px solid var(--control-border);
      border-radius: 7px;
      padding: 8px 10px;
      background: var(--control-bg);
      color: var(--plain-text);
      font: inherit;
      font-weight: 900;
      text-align: right;
    }
    .damageItemBuffRow {
      grid-template-columns: 38px minmax(0, 1fr) auto;
      cursor: pointer;
    }
    .skillLevelRow img,
    .buffRow img,
    .damageItemBuffRow img,
    .damageHeroIcon {
      width: 38px;
      height: 38px;
      object-fit: contain;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--control-bg);
      padding: 3px;
    }
    .damageHeroIcon {
      width: 86px;
      height: 86px;
      object-position: center bottom;
      background: linear-gradient(180deg, var(--control-bg), var(--surface));
    }
    .skillLevelRow strong,
    .buffRow strong,
    .damageItemBuffRow strong {
      display: block;
      overflow: hidden;
      color: var(--plain-text);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .skillLevelRow small,
    .buffRow small,
    .damageItemBuffRow small {
      display: block;
      color: var(--muted);
      font-weight: 700;
      line-height: 1.35;
    }
    .skillTools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .skillTabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .skillTabButton,
    .skillResetButton,
    .skillMaxButton {
      border: 1px solid var(--control-border);
      border-radius: 7px;
      background: var(--control-bg);
      color: var(--plain-text);
      cursor: pointer;
      font: inherit;
      font-weight: 900;
    }
    .skillTabButton {
      min-width: 38px;
      padding: 7px 10px;
      text-align: center;
    }
    .skillTabButton.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--active-text);
    }
    .skillResetButton {
      padding: 7px 10px;
      white-space: nowrap;
    }
    .skillLevelControl {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      align-items: center;
      width: 100%;
      min-width: 0;
    }
    .skillLevelControl input {
      box-sizing: border-box;
      width: 100%;
      min-width: 0;
      border: 1px solid var(--control-border);
      border-radius: 7px;
      padding: 8px;
      background: var(--control-bg);
      color: var(--plain-text);
      font: inherit;
      font-weight: 900;
      text-align: right;
    }
    .skillMaxButton {
      align-self: stretch;
      padding: 0 8px;
      font-size: 11px;
    }
    .skillMaxButton:disabled,
    .skillResetButton:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }
    .damageWarning {
      grid-column: 2 / -1;
      color: #b45309;
      font-size: 12px;
      font-weight: 800;
    }
    .damageBudgetHint,
    .damageBudgetList {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.45;
    }
    .damageBudgetList {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .damageBudgetPill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 8px;
      background: var(--control-bg);
      color: var(--plain-text);
    }
    .damageBudgetPill.isEmpty {
      color: var(--muted);
    }
    .skillLevelRow.isLocked {
      opacity: 0.62;
    }
    .skillLevelRow input:disabled {
      cursor: not-allowed;
      opacity: 0.75;
    }
    :root[data-theme="dark"] .damageWarning {
      color: #facc15;
    }
    .damageHero {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding: 18px 22px;
    }
    .damageHero h2 {
      margin: 0;
      color: var(--plain-text);
      font-size: 30px;
      line-height: 1.1;
    }
    .damageHero p {
      margin: 6px 0 0;
      color: var(--muted);
      font-weight: 800;
    }
    .damageResultCards {
      display: flex;
      flex-wrap: nowrap;
      justify-content: flex-end;
      gap: 10px;
    }
    .damageResultCard {
      min-width: 112px;
      border: 1px solid var(--gold-line);
      border-radius: 8px;
      padding: 10px 12px;
      background: var(--gold-card);
      color: var(--plain-text);
      text-align: center;
    }
    .damageResultCard strong {
      display: block;
      font-size: 26px;
      line-height: 1.1;
    }
    .damageResultCard span {
      color: var(--gold-text);
      font-size: 12px;
      font-weight: 900;
    }
    .damageContent {
      display: grid;
      gap: 16px;
      padding: 16px 22px 28px;
    }
    .damagePanel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }
    .damagePanelHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      padding: 12px 14px;
    }
    .damagePanelHeader h3 {
      margin: 0;
      color: var(--plain-text);
      font-size: 18px;
    }
    .damagePanelBody {
      padding: 14px;
    }
    .formulaGrid,
    .damageSkillGrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 10px;
    }
    .formulaCard,
    .damageSkillCard {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 11px;
      background: var(--card);
    }
    .formulaCard strong,
    .damageSkillCard strong {
      color: var(--plain-text);
    }
    .formulaCard p,
    .damageSkillCard p {
      margin: 6px 0 0;
      color: var(--muted);
      font-weight: 750;
      line-height: 1.45;
    }
    .damageSkillCard {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }
    .damageSkillCard img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--control-bg);
      padding: 3px;
    }
    .damageSkillNumbers {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .damagePill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 8px;
      color: var(--plain-text);
      background: var(--control-bg);
      font-size: 12px;
      font-weight: 900;
    }
    .selectedBuffList {
      display: grid;
      gap: 6px;
      margin-top: 10px;
    }
    .selectedBuff {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 7px 8px;
      background: var(--card);
      color: var(--plain-text);
      font-weight: 800;
    }
    .selectedBuff button {
      border: 1px solid var(--control-border);
      border-radius: 6px;
      background: var(--control-bg);
      color: var(--plain-text);
      cursor: pointer;
      font: inherit;
      font-weight: 900;
    }
    @media (max-width: 860px) {
      .damageLayout {
        grid-template-columns: 1fr;
      }
      .damageHero {
        grid-template-columns: auto minmax(0, 1fr);
      }
      .damageResultCards {
        grid-column: 1 / -1;
        justify-content: stretch;
      }
      .damageResultCard {
        flex: 1 1 0;
      }
      .damageGrid,
      .damageAttackGrid {
        grid-template-columns: 1fr;
      }
      .partyBuffRow {
        grid-template-columns: 22px 38px minmax(0, 1fr);
      }
      .partyBuffLevelControl {
        grid-column: 1 / -1;
        grid-template-columns: auto minmax(72px, 1fr);
      }
      .partyBuffLevel {
        width: 100%;
      }
      .damageStatGrid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .skillLevelRow {
        grid-template-columns: 38px minmax(0, 1fr);
      }
      .skillLevelControl,
      .damageWarning {
        grid-column: 2 / -1;
      }
    }
  </style>
</head>
<body>
  <header class="appHeader">
    <div class="titleArea">
      <h1>戰鬥力計算機</h1>
      <nav class="topNav groupedTopNav" aria-label="頁面切換">
        <details class="navMenuGroup" open>
          <summary>楓葉圖鑑</summary>
          <div class="navMenuLinks">
          <a href="./index.html">怪物</a>
          <a href="./items.html">道具</a>
          <a href="./quests.html">任務</a>
          <a href="./maps.html">地圖</a>
          <a href="./skills.html">技能</a>
          </div>
        </details>
        <details class="navMenuGroup active" open>
          <summary>實用工具</summary>
          <div class="navMenuLinks">
          <a href="./scroll-simulator.html">卷軸模擬器</a>
          <a class="active" href="./damage-calculator.html">戰鬥力計算機</a>
          </div>
        </details>
        <details class="navMenuGroup" open>
          <summary>其他</summary>
          <div class="navMenuLinks">
          <a href="./patch-notes.html">遊戲更新日誌</a>
          <a href="./web-changelog.html">網頁更新日誌</a>
          </div>
        </details>
      </nav>
      <div class="buildMeta" id="buildMeta"></div>
    </div>
    <div class="searchWrap simulatorHeaderControls">
      <button id="themeToggle" class="themeIconButton toggleThemeButton" type="button" aria-pressed="false" aria-label="切換為黑底" title="切換為黑底">☾</button>
      <button id="settingsToggle" class="settingsToggle" type="button" aria-expanded="false" aria-controls="settingsPanel" aria-label="顯示設定" title="顯示設定">⚙</button>
      <span id="resultCount"></span>
      <div id="settingsPanel" class="settingsPanel" hidden>
        <button id="clearFilters" class="toggleButton clearFiltersButton" type="button">清除條件</button>
        <button id="idToggle" class="toggleIdButton" type="button" aria-pressed="false">顯示ID</button>
      </div>
    </div>
  </header>

  <main class="layout damageLayout">
    <aside class="monsterList damageControls">
      <section class="damageControlSection">
        <h2>角色</h2>
        <div class="damageGrid characterGrid">
          <label class="damageField jobField">
            <span>職業</span>
            <select id="jobSelect"></select>
          </label>
          <label class="damageField">
            <span>等級</span>
            <input id="characterLevel" type="number" min="1" max="200" step="1" inputmode="numeric" value="120" autocomplete="off" />
          </label>
          <label class="damageField">
            <span>武器</span>
            <select id="weaponSelect"></select>
          </label>
        </div>
      </section>

      <section class="damageControlSection">
        <h2>基本數值</h2>
        <div class="damageStatGrid" id="baseStats"></div>
        <div id="baseStatBudget" class="damageBudgetHint"></div>
      </section>

      <section class="damageControlSection">
        <h2>追加數值</h2>
        <div class="damageStatGrid" id="equipStats"></div>
        <div class="damageAttackGrid" style="margin-top: 10px;">
          <label class="damageField">
            <span>武器攻擊力</span>
            <input id="weaponAttack" type="number" min="0" step="1" inputmode="numeric" value="80" autocomplete="off" />
          </label>
          <label class="damageField">
            <span>其他裝備攻擊力</span>
            <input id="equipAttack" type="number" min="0" step="1" inputmode="numeric" value="0" autocomplete="off" />
          </label>
          <label class="damageField">
            <span>武器魔法攻擊力</span>
            <input id="weaponMagic" type="number" min="0" step="1" inputmode="numeric" value="80" autocomplete="off" />
          </label>
          <label class="damageField">
            <span>其他裝備魔法攻擊力</span>
            <input id="equipMagic" type="number" min="0" step="1" inputmode="numeric" value="0" autocomplete="off" />
          </label>
        </div>
        <div class="damageAttackGrid" style="margin-top: 10px;">
          <label class="damageField">
            <span>精靈的祝福等級</span>
            <input id="spiritBlessingLevel" type="number" min="0" max="20" step="1" inputmode="numeric" value="0" autocomplete="off" />
          </label>
          <div id="spiritBlessingHint" class="damageBudgetHint"></div>
        </div>
      </section>

      <section class="damageControlSection">
        <h2>技能點數</h2>
        <div class="skillTools">
          <div id="skillTabs" class="skillTabs" role="tablist" aria-label="技能轉職分頁"></div>
          <button id="skillReset" class="skillResetButton" type="button">重設</button>
        </div>
        <div id="skillBudgetSummary" class="damageBudgetList"></div>
        <div id="skillLevelList" class="skillLevelList" style="margin-top: 10px;"></div>
      </section>

      <section class="damageControlSection">
        <h2>BUFF</h2>
        <div class="damageAttackGrid">
          <label class="damageField">
            <span>額外攻擊力</span>
            <input id="manualAttackBuff" type="number" step="1" inputmode="numeric" value="0" autocomplete="off" />
          </label>
          <label class="damageField">
            <span>額外魔法攻擊力</span>
            <input id="manualMagicBuff" type="number" step="1" inputmode="numeric" value="0" autocomplete="off" />
          </label>
        </div>
        <div id="skillBuffList" class="buffList" style="margin-top: 10px;"></div>
        <input id="itemBuffSearch" class="damageSearchInput" type="search" autocomplete="off" placeholder="搜尋道具 BUFF" style="margin-top: 10px;" />
        <div id="itemBuffResults" class="damageItemBuffResults" style="margin-top: 8px;"></div>
        <div id="selectedItemBuffs" class="selectedBuffList"></div>
      </section>
    </aside>

    <section class="detail damageDetail" id="damageDetail"></section>
  </main>

  <script src="./damage-calculator-data.js"></script>
  <script src="./damage-calculator.js"></script>
</body>
</html>
