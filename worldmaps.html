  <title>楓憶MapleMemory —— 新楓之谷：經典版資料庫</title>
  <link rel="icon" href="data:," />
  <meta http-equiv="refresh" content="0; url=./maps.html?view=world" />
  <script>
    (function () {
      var target = new URL("./maps.html", window.location.href);
      target.searchParams.set("view", "world");
      var params = new URLSearchParams(window.location.search);
      params.forEach(function (value, key) {
        if (key !== "view") target.searchParams.set(key, value);
      });
      if (window.location.hash) target.hash = window.location.hash;
      window.location.replace(target.href);
    })();
  </script>
