<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />

  <title>楓憶MapleMemory —— 任務等級區間彙總</title>
  <link rel="icon" href="data:," />
  <script>
    (function () {
      function readCookie(name) {
        try {
          var prefix = encodeURIComponent(name) + "=";
          var rows = document.cookie ? document.cookie.split("; ") : [];
          for (var i = 0; i < rows.length; i += 1) {
            if (rows[i].indexOf(prefix) === 0) return decodeURIComponent(rows[i].slice(prefix.length));
          }
        } catch (_error) {}
        return "";
      }
      try {
        var cookieTheme = readCookie("ms_theme");
        var storedTheme = cookieTheme || (localStorage.getItem("ms-theme") === "dark" ? "dark" : "light");
        document.documentElement.dataset.theme = storedTheme === "dark" ? "dark" : "light";
      } catch (_error) {
        document.documentElement.dataset.theme = readCookie("ms_theme") === "dark" ? "dark" : "light";
      }
    })();
  </script>
  <link rel="icon" href="./assets/items/4031456.png" type="image/png" />
  <link rel="apple-touch-icon" href="./assets/items/4031456.png" />
  <link rel="stylesheet" href="./styles.css?v=20260820170957" />
  <style>
    .qsLayout {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 16px;
    }
    .qsPanel {
      max-width: 1180px;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--detail-bg);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(10px);
    }
    .mobileDock {
      display: none !important;
    }
    .qsHero {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 14px;
      border-bottom: 1px solid var(--hero-border);
      background: var(--hero-bg);
    }
    .qsHero h2 {
      margin: 0 0 3px;
      font-size: 24px;
    }
    .qsHero .heroCounters {
      grid-template-columns: repeat(3, minmax(92px, auto));
    }
    .qsHero p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }
    .qsTableWrap {
      overflow-x: auto;
      padding: 0 14px 16px;
    }
    .qsTable {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .qsTable th,
    .qsTable td {
      border-bottom: 1px dashed var(--dash-line);
      padding: 9px 10px;
      text-align: left;
      vertical-align: top;
    }
    .qsTable thead th {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      background: var(--shell);
    }
    .qsTable td.num,
    .qsTable th.num {
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .qsTable td.num strong {
      font-size: 15px;
    }
    .qsLevelCell {
      white-space: nowrap;
      color: var(--control-text);
      font-weight: 800;
    }
    .qsQuestName {
      display: block;
      overflow-wrap: anywhere;
      font-weight: 800;
      color: inherit;
      text-decoration: none;
    }
    .qsQuestName:hover {
      color: var(--active-text);
    }
    .qsQuestId {
      margin-left: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    body:not(.showIds) .qsQuestId {
      display: none;
    }
    .qsItems {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .qsItemChip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px dashed var(--dash-line);
      border-radius: 7px;
      background: var(--card-bg);
      padding: 3px 8px 3px 4px;
      color: inherit;
      text-decoration: none;
      font-weight: 700;
      line-height: 1.3;
    }
    .qsItemChip:hover {
      border-color: var(--link-hover-border);
      background: var(--link-hover-bg);
    }
    .qsItemChip img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      border-radius: 5px;
      background: var(--icon-bg);
      padding: 2px;
    }
    .qsItemChip b {
      font-variant-numeric: tabular-nums;
    }
    .qsBadge {
      display: inline-block;
      border-radius: 5px;
      background: var(--item-glyph-bg);
      color: var(--item-glyph-text);
      padding: 1px 5px;
      font-size: 10px;
      font-weight: 900;
    }
    .qsQuestList {
      margin: 4px 0 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 12px;
    }
    .qsQuestList a {
      color: inherit;
    }
    .qsEmpty {
      padding: 26px 14px;
      color: var(--muted);
      text-align: center;
    }
    .qsNote {
      padding: 10px 14px 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    @media (max-width: 720px) {
      .qsHero {
        grid-template-columns: 1fr;
      }
      .qsHero .heroCounters {
        justify-self: start;
      }
    }
  </style>
</head>
<body>

  <section class="pageToolbar" aria-label="任務等級區間查詢">
    <div class="searchWrap pageToolbarControls">
      <label class="advancedField questLevelField">
        <span>等級下限</span>
        <input id="levelMin" type="number" min="1" max="999" step="1" inputmode="numeric" placeholder="下限" autocomplete="off" />
      </label>
      <label class="advancedField questLevelField">
        <span>等級上限</span>
        <input id="levelMax" type="number" min="1" max="999" step="1" inputmode="numeric" placeholder="上限" autocomplete="off" />
      </label>
      <button id="applyRange" class="toggleButton" type="button">套用區間</button>
      <label class="nameOnlySearchControl">
        <input id="onlyWithItems" type="checkbox" autocomplete="off" checked />
        <span>只顯示需繳交物品的任務</span>
      </label>
      <button id="idToggle" class="toggleIdButton toggleButton" type="button" aria-pressed="false">顯示ID</button>
      <span id="resultCount"></span>
    </div>
  </section>

  <main class="qsLayout">
    <section class="qsPanel" id="summaryPane">
      <div class="qsHero">
        <div>
          <h2>任務等級區間彙總</h2>
          <p>輸入等級區間，列出該區間可接任務及其完成所需繳交的物品，並彙總所有掉落物總需求量。</p>
        </div>
        <div class="heroCounters" id="heroCounters"></div>
      </div>
      <div id="resultArea"></div>
      <p class="qsNote">說明：「非掉落」代表該道具未出現於怪物掉落表中，多為 NPC 轉交、製作或活動取得，不會計入下方「掉落物需求彙總」；等級顯示「?」表示該任務未登記等級上下限，仍會與區間進行比對。資料來源：quests-data.js（遊戲版本 1.14.5）。</p>
    </section>
  </main>

  <script src="./data.js?v=20260820170957"></script>
  <script src="./quests-data.js?v=20260820170957"></script>
  <script src="./mobile.js?v=20260820170957"></script>
  <script>
    (function () {
      "use strict";

      var els = {
        themeToggle: document.getElementById("themeToggle"),
        levelMin: document.getElementById("levelMin"),
        levelMax: document.getElementById("levelMax"),
        applyRange: document.getElementById("applyRange"),
        onlyWithItems: document.getElementById("onlyWithItems"),
        idToggle: document.getElementById("idToggle"),
        resultCount: document.getElementById("resultCount"),
        heroCounters: document.getElementById("heroCounters"),
        resultArea: document.getElementById("resultArea")
      };

      function escapeHtml(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
        });
      }

      function formatNumber(value) {
        return Number(value || 0).toLocaleString();
      }

      function itemUrl(id) {
        return "./items.html?item=" + encodeURIComponent(id);
      }

      function questUrl(id) {
        return "./quests.html?quest=" + encodeURIComponent(id);
      }

      function readCookie(name) {
        try {
          var prefix = encodeURIComponent(name) + "=";
          var rows = document.cookie ? document.cookie.split("; ") : [];
          for (var i = 0; i < rows.length; i += 1) {
            if (rows[i].indexOf(prefix) === 0) return decodeURIComponent(rows[i].slice(prefix.length));
          }
        } catch (_error) {}
        return "";
      }

      function writeCookie(name, value) {
        try {
          var expires = new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toUTCString();
          document.cookie = encodeURIComponent(name) + "=" + encodeURIComponent(value) + "; expires=" + expires + "; path=/; SameSite=Lax";
        } catch (_error) {}
      }

      function applyTheme() {
        var isDark = document.documentElement.dataset.theme === "dark";
        if (!els.themeToggle) return;
        var label = isDark ? "切換為白底" : "切換為黑底";
        els.themeToggle.setAttribute("aria-pressed", String(isDark));
        els.themeToggle.setAttribute("aria-label", label);
        els.themeToggle.textContent = isDark ? "☀" : "☾";
        els.themeToggle.title = label;
      }

      els.themeToggle.addEventListener("click", function () {
        var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        writeCookie("ms_theme", next);
        try { localStorage.setItem("ms-theme", next); } catch (_error) {}
        applyTheme();
      });
      applyTheme();

      var dropItemIds = null;
      try {
        dropItemIds = new Set();
        (window.MS_DROP_DB.monsters || []).forEach(function (monster) {
          (monster.drops || []).forEach(function (drop) {
            dropItemIds.add(Number(drop.id));
          });
        });
      } catch (_error) {
        dropItemIds = null;
      }

      var state = { min: 1, max: 20 };

      function initialParams() {
        var params = new URLSearchParams(window.location.search);
        var min = parseInt(params.get("min"), 10);
        var max = parseInt(params.get("max"), 10);
        if (!isNaN(min)) els.levelMin.value = String(min); else els.levelMin.value = "1";
        if (!isNaN(max)) els.levelMax.value = String(max); else els.levelMax.value = "20";
        state.min = isNaN(min) ? 1 : min;
        state.max = isNaN(max) ? 20 : max;
      }

      function levelText(quest) {
        var lo = quest.minLevel;
        var hi = quest.maxLevel;
        var loText = lo == null ? "?" : String(lo);
        var hiText = hi == null ? "?" : String(hi);
        return loText + " ~ " + hiText;
      }

      function sortKey(quest) {
        return [quest.minLevel == null ? Number.MAX_SAFE_INTEGER : quest.minLevel, Number(quest.id)];
      }

      function requiredItems(quest) {
        return (quest.completeRequirements && quest.completeRequirements.items) || [];
      }

      function itemChip(item) {
        var isDrop = !dropItemIds || dropItemIds.has(Number(item.id));
        var badge = isDrop ? "" : '<span class="qsBadge">非掉落</span>';
        var count = item.count || 1;
        return '<a class="qsItemChip" href="' + itemUrl(item.id) + '">' +
          '<img src="./assets/items/' + encodeURIComponent(item.id) + '.png" alt="" loading="lazy" onerror="this.remove()" />' +
          "<span>" + escapeHtml(item.name) + " <b>x" + escapeHtml(formatNumber(count)) + "</b> " + badge + "</span>" +
          "</a>";
      }

      function render() {
        var lo = Math.min(state.min, state.max);
        var hi = Math.max(state.min, state.max);
        var onlyWithItems = els.onlyWithItems.checked;

        var matched = (window.MS_QUEST_DB.quests || []).filter(function (quest) {
          var qLo = quest.minLevel;
          var qHi = quest.maxLevel;
          if (qLo == null && qHi == null) return false;
          var overlaps = (qHi == null || qHi >= lo) && (qLo == null || qLo <= hi);
          if (!overlaps) return false;
          if (onlyWithItems && !requiredItems(quest).length) return false;
          return true;
        });

        matched.sort(function (a, b) {
          var ka = sortKey(a);
          var kb = sortKey(b);
          if (ka[0] !== kb[0]) return ka[0] - kb[0];
          return ka[1] - kb[1];
        });

        var aggregate = new Map();
        matched.forEach(function (quest) {
          requiredItems(quest).forEach(function (item) {
            var isDrop = !dropItemIds || dropItemIds.has(Number(item.id));
            if (!isDrop) return;
            var key = item.id + "|" + item.name;
            if (!aggregate.has(key)) {
              aggregate.set(key, { id: item.id, name: item.name, image: item.image, total: 0, perQuest: new Map() });
            }
            var record = aggregate.get(key);
            var amount = item.count || 1;
            record.total += amount;
            var entry = record.perQuest.get(quest.id);
            if (entry) {
              entry.count += amount;
            } else {
              record.perQuest.set(quest.id, { quest: quest, count: amount });
            }
          });
        });

        var aggregated = Array.from(aggregate.values()).sort(function (a, b) {
          if (b.total !== a.total) return b.total - a.total;
          return a.name.localeCompare(b.name, "zh-Hant");
        });

        var totalPieces = aggregated.reduce(function (sum, record) { return sum + record.total; }, 0);

        els.heroCounters.innerHTML =
          '<div class="heroCounter"><strong>' + escapeHtml(formatNumber(matched.length)) + '</strong><span>任務</span></div>' +
          '<div class="heroCounter"><strong>' + escapeHtml(formatNumber(aggregated.length)) + '</strong><span>物品種類</span></div>' +
          '<div class="heroCounter"><strong>' + escapeHtml(formatNumber(totalPieces)) + '</strong><span>總需求件數</span></div>';

        els.resultCount.textContent = "等級 " + lo + " ~ " + hi + "：" + formatNumber(matched.length) + " 個任務、" + formatNumber(aggregated.length) + " 種物品";

        if (!matched.length) {
          els.resultArea.innerHTML = '<div class="qsEmpty">此等級區間內沒有符合條件的任務。</div>';
          return;
        }

        var questRows = matched.map(function (quest) {
          var items = requiredItems(quest);
          var itemsHtml = items.length
            ? '<div class="qsItems">' + items.map(function (item) { return itemChip(item); }).join("") + "</div>"
            : '<span style="color:var(--muted)">無需繳交物品</span>';
          return "<tr>" +
            '<td class="qsLevelCell">' + escapeHtml(levelText(quest)) + "</td>" +
            '<td><a class="qsQuestName" href="' + questUrl(quest.id) + '">' + escapeHtml(quest.name) + '<span class="qsQuestId">#' + escapeHtml(quest.id) + "</span></a></td>" +
            "<td>" + itemsHtml + "</td>" +
            "</tr>";
        }).join("");

        var summaryRows = aggregated.map(function (record) {
          var questEntries = Array.from(record.perQuest.values()).sort(function (a, b) {
            var ka = sortKey(a.quest);
            var kb = sortKey(b.quest);
            if (ka[0] !== kb[0]) return ka[0] - kb[0];
            return ka[1] - kb[1];
          });
          var questListHtml = '<ul class="qsQuestList">' + questEntries.map(function (entry) {
            return '<li><a href="' + questUrl(entry.quest.id) + '">' + escapeHtml(entry.quest.name) + " <b>x" + escapeHtml(formatNumber(entry.count)) + "</b></a></li>";
          }).join("") + "</ul>";
          return "<tr>" +
            '<td><a class="qsItemChip" href="' + itemUrl(record.id) + '"><img src="./assets/items/' + encodeURIComponent(record.id) + '.png" alt="" loading="lazy" onerror="this.remove()" /><span>' + escapeHtml(record.name) + "</span></a></td>" +
            '<td class="num"><strong>' + escapeHtml(formatNumber(record.total)) + "</strong></td>" +
            "<td>" + questListHtml + "</td>" +
            "</tr>";
        }).join("");

        var summarySection = '<section class="sectionBlock">' +
          '<div class="sectionTitle"><h3>掉落物需求彙總</h3><span>' + escapeHtml(formatNumber(aggregated.length)) + " 種 · 共 " + escapeHtml(formatNumber(totalPieces)) + " 件</span></div>";
        if (summaryRows) {
          summarySection +=
            '<div class="qsTableWrap"><table class="qsTable">' +
              '<thead><tr><th>物品</th><th class="num">總需求</th><th>相關任務需求</th></tr></thead>' +
              "<tbody>" + summaryRows + "</tbody>" +
            "</table></div>";
        } else {
          summarySection += '<div class="qsEmpty">此等級區間內沒有可由怪物掉落的繳交物品。</div>';
        }
        summarySection += "</section>";

        els.resultArea.innerHTML =
          '<section class="sectionBlock">' +
            '<div class="sectionTitle"><h3>任務清單（依等級排序）</h3><span>' + escapeHtml(formatNumber(matched.length)) + " 個</span></div>" +
            '<div class="qsTableWrap"><table class="qsTable">' +
              "<thead><tr><th>等級</th><th>任務</th><th>所需物品</th></tr></thead>" +
              "<tbody>" + questRows + "</tbody>" +
            "</table></div>" +
          "</section>" +
          summarySection;
      }

      function updateUrl() {
        var url = new URL(window.location.href);
        url.searchParams.set("min", String(state.min));
        url.searchParams.set("max", String(state.max));
        window.history.replaceState(null, "", url);
      }

      function apply() {
        var min = parseInt(els.levelMin.value, 10);
        var max = parseInt(els.levelMax.value, 10);
        if (isNaN(min)) min = 1;
        if (isNaN(max)) max = 999;
        min = Math.max(1, Math.min(999, min));
        max = Math.max(1, Math.min(999, max));
        state.min = min;
        state.max = max;
        els.levelMin.value = String(min);
        els.levelMax.value = String(max);
        updateUrl();
        render();
      }

      els.applyRange.addEventListener("click", apply);
      [els.levelMin, els.levelMax].forEach(function (input) {
        input.addEventListener("keydown", function (event) {
          if (event.key === "Enter") apply();
        });
      });
      els.onlyWithItems.addEventListener("change", render);
      els.idToggle.addEventListener("click", function () {
        var pressed = els.idToggle.getAttribute("aria-pressed") === "true";
        els.idToggle.setAttribute("aria-pressed", String(!pressed));
        document.body.classList.toggle("showIds", !pressed);
      });

      initialParams();
      render();
    })();
  </script>
</body>
